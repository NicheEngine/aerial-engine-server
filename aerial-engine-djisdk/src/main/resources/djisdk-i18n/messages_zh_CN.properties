AERIAL_DJISDK_ERROR_312031=重试升级的时候出现了错误，可能是传输断开。
AERIAL_DJISDK_ERROR_324042=飞机未连接, 无法查询/更新/开关证书。
AERIAL_DJISDK_ERROR_325013=设备正忙，请稍后重试。
AERIAL_DJISDK_ERROR_325000=dongle或者链路信息获取超时，请检查飞机是否开机，4G dongle是否正常工作。
AERIAL_DJISDK_ERROR_325014=操作失败，请检查切换镜头指令的video_type大小写是否有误。
