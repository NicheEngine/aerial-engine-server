server.port=8080

spring.jmx.enabled=false
spring.application.name=aerial-engine-server
spring.jmx.default-domain=aerial-engine-server
spring.mvc.servlet.path=/aerial

server.tomcat.connection-timeout=600s
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2GB
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet

spring.jackson.default-property-inclusion=non_null
spring.jackson.parser.allow-unquoted-control-chars=true
spring.jackson.parser.allow-comments=true
spring.jackson.parser.allow-single-quotes=true
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=GMT+8

spring.main.allow-circular-references =true
mybatis.configuration.map-underscore-to-camel-case=true

# console log error configuration
nichetoolkit.rest.error.console-log.rest-exception-enabled=false
nichetoolkit.rest.error.console-log.common-exception-enabled=true

# jwt worker configuration
nichetoolkit.rest.jwt.enabled=true
nichetoolkit.rest.jwt.algorithm=hs256
nichetoolkit.rest.jwt.secret=ICBwpv3gDQLfdrtTuek5wtQ
nichetoolkit.rest.jwt.kid=
nichetoolkit.rest.jwt.issuer=io.github.nicheengine
nichetoolkit.rest.jwt.audiences=
nichetoolkit.rest.jwt.expire-time=0
nichetoolkit.rest.jwt.expire-unit=millis
nichetoolkit.rest.jwt.issued-delay-time=0
nichetoolkit.rest.jwt.issued-delay-unit=millis
nichetoolkit.rest.jwt.not-before-enabled=false


# sha worker configuration
# app: ICBwpv3gDQLfdrtTuek5wtQ
nichetoolkit.rest.sha.enabled=true
nichetoolkit.rest.sha.algorithm=sha256
nichetoolkit.rest.sha.secret=ZbqWif8ZSnjWQS5iznqXcUoKEjAV4sqJVLtV2XoeUDkGe3vPe8mAL3PhdulCRaPQxI46V86kzmf97UeigGk

# identity worker configuration
nichetoolkit.rest.identity.enabled=true
nichetoolkit.rest.identity.type=config
nichetoolkit.rest.identity.config.worker-id=1
nichetoolkit.rest.identity.config.center-id=2

# intercept configuration
nichetoolkit.rest.intercept.enabled=true
nichetoolkit.rest.intercept.logging-enabled=false
nichetoolkit.rest.intercept.userlog-enabled=true
nichetoolkit.rest.intercept.bean-enabled=true
nichetoolkit.rest.intercept.body-length=1024
nichetoolkit.rest.intercept.error-length=1024
nichetoolkit.rest.intercept.message-length=1024
nichetoolkit.rest.intercept.result-length=1024

# http client configuration
nichetoolkit.rest.http.enabled=true
nichetoolkit.rest.http.connect-timeout=2000
nichetoolkit.rest.http.read-timeout=30000
nichetoolkit.rest.http.request-timeout=200
nichetoolkit.rest.http.max-core-size=5
nichetoolkit.rest.http.max-idle-size=10
nichetoolkit.rest.http.http-type=ok_http_client
nichetoolkit.rest.http.charset=utf-8
nichetoolkit.rest.http.encoding-mode=none
nichetoolkit.rest.http.retry-times=0
nichetoolkit.rest.http.keep-alive-time=600000
nichetoolkit.rest.http.proxy.type=socks
nichetoolkit.rest.http.proxy.hostname=
nichetoolkit.rest.http.proxy.port=


nichetoolkit.rest.i18n.enabled=true
nichetoolkit.rest.i18n.locale=china
nichetoolkit.rest.i18n.basename=djisdk-i18n/messages,aerial-i18n/messages
nichetoolkit.rest.i18n.session-resolver-enabled=false
nichetoolkit.rest.i18n.cookie-resolver-enabled=false
nichetoolkit.rest.i18n.interceptor-enabled=true
nichetoolkit.rest.i18n.param-name=lang

# logback configuration
nichetoolkit.rest.logback.enabled=true
nichetoolkit.rest.logback.logging-key=loggingKey
nichetoolkit.rest.logback.attributes=t
nichetoolkit.rest.logback.request-key=requestKey
nichetoolkit.rest.logback.request-header=X-Request-ID
nichetoolkit.rest.logback.argument-length=1024
nichetoolkit.rest.logback.prefix-length=12

# service configuration
nichetoolkit.rice.service.unique-model=false
nichetoolkit.rice.service.identity-invade=false
nichetoolkit.rice.service.identity-check=false
nichetoolkit.rice.service.unique-name=true
nichetoolkit.rice.service.nonnull-name=true
nichetoolkit.rice.service.partition.query-size=2000
nichetoolkit.rice.service.partition.save-size=500
nichetoolkit.rice.service.partition.delete-size=1000
nichetoolkit.rice.service.before-skip=true
nichetoolkit.rice.service.after-skip=true
nichetoolkit.rice.service.save-result-ignored=true

# login configuration
nichetoolkit.rice.login.enabled=true
nichetoolkit.rice.login.token-prefixes=Bearer
nichetoolkit.rice.login.skip-urls=
nichetoolkit.rice.login.token-headers=Authorization
nichetoolkit.rice.login.token-expiration=1800
nichetoolkit.rice.login.token-time-unit=seconds
nichetoolkit.rice.login.access-token-header=Access-Token
nichetoolkit.rice.login.access-auth-header=Access-Auth

# hikari datasource configuration
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=HikariCP
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# service configuration
nichetoolkit.rice.service.delete-mode=remove
nichetoolkit.rice.service.delete.logic-mode=config
nichetoolkit.rice.service.delete.config-mark=number
nichetoolkit.rice.service.delete.auto-mark=identity
nichetoolkit.rice.service.delete.accurate-judge=true
nichetoolkit.rice.service.dynamic-table=false

# postgresql table configuration
nichetoolkit.mybatis.table.use-logic=true
nichetoolkit.mybatis.table.use-operate=false
nichetoolkit.mybatis.table.update-logic=false
nichetoolkit.mybatis.table.exclude-unused=true
nichetoolkit.mybatis.table.sql-script-show=true
nichetoolkit.mybatis.table.mysql-ignore-insert=false
nichetoolkit.mybatis.table.datetime-now=now()
nichetoolkit.mybatis.table.database-type=postgresql
nichetoolkit.mybatis.table.style-type=lower_underline
nichetoolkit.mybatis.table.excluded-type=excluded

nicheengine.aerial.websocket.endpoints=/api/v1/ws
nicheengine.aerial.websocket.allowed-origins=*

spring.profiles.active=dev

logging.config=classpath:logback-spring.xml

nicheengine.aerial.mqtt.topics=sys/product/+/status,thing/product/+/requests

logging.file.path=logs